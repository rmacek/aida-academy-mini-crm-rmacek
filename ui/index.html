<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Mini CRM</h1>
      <nav class="tenant-nav">
        <button id="tenant-nordstern" class="tenant-btn active" data-tenant="tenant-nordstern">Nordstern</button>
        <button id="tenant-alpenblick" class="tenant-btn" data-tenant="tenant-alpenblick">Alpenblick</button>
      </nav>
    </header>

    <main class="app-main">
      <div class="sidebar">
        <div class="sales-opportunity-list" id="opportunityList">
          <!-- Opportunity list will be populated by JavaScript -->
        </div>
      </div>

      <div class="workspace" id="workspace">
        <!-- Workspace content will be populated by JavaScript -->
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
